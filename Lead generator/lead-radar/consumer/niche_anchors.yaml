# Per-niche anchor terms for the relevance gate that filters leads
# before Google Sheets writes. Each anchor is a case-insensitive
# substring matched against (title + " " + text). A lead passes the
# gate iff at least one anchor for its niche is present.
#
# Design rules:
#  - prefer compound terms unique to the niche (e.g. "cv-ketel" not "cv")
#  - include common Dutch + brand-name forms so genuine posts pass
#  - avoid 2-3 letter substrings that match unrelated Dutch words
#
# Tuning: anchors are config, not code. Update this file when a real
# niche post is dropped by the gate (false negative) or a contaminant
# slips through (false positive).

